<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine Surprise</title>
    <style>
        body {
            text-align: center;
            background-color: pink;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: red;
        }
        .container {
            margin-top: 50px;
        }
        .button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        .yes-button {
            background-color: red;
            color: white;
        }
        .no-button {
            background-color: white;
            color: red;
            position: absolute;
        }
        .balloons {
            position: fixed;
            bottom: -100px;
            width: 100%;
            display: flex;
            justify-content: space-around;
        }
        .balloon {
            width: 50px;
            height: 70px;
            background-color: red;
            border-radius: 50%;
            position: relative;
            animation: float 5s infinite ease-in-out;
        }
        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-300px); }
            100% { transform: translateY(0); }
        }
    </style>
</head>
<body>
    <h1>Will You Be My Valentine? ❤️</h1>
    <div class="container">
        <button class="button yes-button" onclick="alert('Yay! 💖')">Yes</button>
        <button class="button no-button" onmouseover="moveButton()">No</button>
    </div>
    <div class="balloons">
        <div class="balloon"></div>
        <div class="balloon" style="background-color: pink;"></div>
        <div class="balloon"></div>
    </div>
    <script>
        function moveButton() {
            let x = Math.random() * (window.innerWidth - 100);
            let y = Math.random() * (window.innerHeight - 50);
            document.querySelector('.no-button').style.left = x + 'px';
            document.querySelector('.no-button').style.top = y + 'px';
        }
    </script>
</body>
</html>
